server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  large_client_header_buffers 8 32k;
  client_header_buffer_size 16k;
  client_max_body_size 25m;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Pages HTML : toujours revalidées par le navigateur (sinon cache heuristique
  # sur Last-Modified → les visiteurs voient une vieille version pendant des heures).
  # Next.js export → URLs avec trailingSlash: true. Fichier exact, sinon dossier
  # (index.html), sinon .html, sinon vraie 404 (out/404.html).
  location / {
    expires -1;
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Bundles Next (noms hachés) : cache long et immuable
  location ^~ /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Autres assets (photos, logos, icônes, og.png : noms stables, peuvent changer) : 1 jour
  location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|xml|txt)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
