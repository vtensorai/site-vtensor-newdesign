server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  large_client_header_buffers 8 32k;
  client_header_buffer_size 16k;
  client_max_body_size 25m;

  # Next.js export → URLs avec trailingSlash: true.
  # On sert le fichier exact, sinon le dossier (avec /index.html), sinon le
  # .html, sinon une vraie 404 (out/404.html généré par Next depuis
  # src/app/not-found.tsx). Plus de fallback vers la home en 200.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Cache long pour les assets buildés (hashés par Next)
  location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
